<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honest Barcode · Ícono</title>
<style>
body { margin: 0; padding: 40px 24px; font-family: system-ui, sans-serif; background: #eee; color: #171717; }
main { max-width: 760px; margin: auto; }
h1 { font-size: 24px; }
.sizes { display: flex; align-items: end; flex-wrap: wrap; gap: 32px; margin: 40px 0; }
figure { margin: 0; text-align: center; }
img { display: block; border-radius: 22%; }
figcaption { margin-top: 12px; font-size: 13px; color: #555; }
.dark { background: #202124; padding: 28px; border-radius: 24px; color: white; }
.dark figcaption { color: #ccc; }
</style>
<main>
<h1>Honest Barcode</h1>
<p>Versión simplificada · Vista a tamaño real en píxeles CSS.</p>
<div class="sizes">
<figure><img src="honest-barcode-icon-v2.png" width="180" height="180" alt="Ícono ampliado"><figcaption>180 px</figcaption></figure>
<figure><img src="honest-barcode-icon-v2.png" width="60" height="60" alt="Ícono de inicio"><figcaption>60 px</figcaption></figure>
<figure><img src="honest-barcode-icon-v2.png" width="48" height="48" alt="Ícono pequeño"><figcaption>48 px</figcaption></figure>
<figure><img src="honest-barcode-icon-v2.png" width="32" height="32" alt="Ícono compacto"><figcaption>32 px</figcaption></figure>
</div>
<div class="sizes dark">
<figure><img src="honest-barcode-icon-v2.png" width="60" height="60" alt="Ícono sobre fondo oscuro"><figcaption>60 px · fondo oscuro</figcaption></figure>
<figure><img src="honest-barcode-icon-v2.png" width="48" height="48" alt="Ícono pequeño sobre fondo oscuro"><figcaption>48 px</figcaption></figure>
</div>
</main>
</html>
